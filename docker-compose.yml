services:
  
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ai-chat-pdf-belajar-2

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_chat_pdf_2

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ai-chat-redis-2
    
    restart: always

    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend

    container_name: ai-chat-backend-2

    restart: always

    env_file:
      - ./backend/.env.docker

    ports:
      - "3000:3000"
    
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend/uploads:/app/uploads

  worker:
    build:
      context: ./backend
      
    container_name: ai-chat-worker-2

    restart: always

    command: npm run start:worker

    env_file:
      - ./backend/.env.docker

    depends_on:
      - postgres
      - redis
    
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
    
    container_name: ai-chat-frontend-2

    restart: always

    ports:
      - "80:80"

    depends_on:
      - backend

volumes:
  postgres_data: